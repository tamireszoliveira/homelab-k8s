apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    # Repositório oficial do SIG kubernetes-sigs.
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      values: |
        args:
          # Os kubelets do kind usam certificado autoassinado; sem esta flag
          # o metrics-server rejeita o TLS e `kubectl top` nunca funciona.
          - --kubelet-insecure-tls
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
