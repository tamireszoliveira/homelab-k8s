apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-homelab
  namespace: argocd
spec:
  project: default
  source:
    # Caminho "Kustomize": manifests que vivem neste repositório, sem
    # dependência de chart ou registry de terceiros (só a imagem nginx
    # oficial). É o modelo a copiar para os seus próprios workloads.
    repoURL: https://github.com/tamireszoliveira/homelab-k8s
    targetRevision: main
    path: apps/overlays/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
