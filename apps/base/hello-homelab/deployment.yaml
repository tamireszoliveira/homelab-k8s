apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-homelab
  template:
    metadata:
      labels:
        app: hello-homelab
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
